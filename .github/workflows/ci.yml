name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash -n setup.sh backend-setup.sh coder-setup.sh gitlab-setup.sh certify.sh
      - run: shellcheck setup.sh backend-setup.sh coder-setup.sh gitlab-setup.sh certify.sh
